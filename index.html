<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>網站暫時下架</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
        background: #050505;
        color: #f4f1ea;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #050505;
      }

      main {
        max-width: 640px;
        width: 100%;
      }

      p {
        color: #a7a7a7;
        line-height: 1.8;
        margin: 12px 0 0;
      }

      .eyebrow {
        color: #f2c14e;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
      }

      h1 {
        font-size: clamp(36px, 7vw, 80px);
        line-height: 1.05;
        margin: 16px 0 0;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">TEMPORARILY OFFLINE</div>
      <h1>網站暫時下架</h1>
      <p>此展示頁目前暫停公開瀏覽。</p>
    </main>
  </body>
</html>
